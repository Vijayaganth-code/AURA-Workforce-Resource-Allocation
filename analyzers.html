<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURA · Decision Lab</title><link rel="stylesheet" href="styles.css"><style>main{max-width:1100px;margin:40px auto;padding:0 24px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.action{padding:11px 15px;border:0;background:#183f35;color:white;cursor:pointer;border-radius:5px}.panel{display:none;background:#fff;padding:24px;margin-top:20px;border:1px solid #dfe5df;border-radius:8px}.panel.active{display:block}label{display:block;margin:12px 0;font-weight:700}input,select,textarea{display:block;width:100%;max-width:650px;padding:9px;margin-top:5px}table{width:100%;border-collapse:collapse;margin-top:16px}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.results{margin-top:20px;padding:16px;background:#f1f7f3}.notice{color:#a24b14;font-weight:700}.result-grid{display:grid;grid-template-columns:repeat(2,minmax(160px,1fr));gap:8px;padding:12px;background:#fff}.result-grid b{color:#183f35}</style></head><body><main><a href="/">← Command Center</a><h1>AURA Decision Lab</h1><p class="notice">Simulation Mode — recommendations do not change production state. Applying a plan requires approval.</p><div class="tabs"><button data-tab="project">New Project Analyzer</button><button data-tab="leave">Leave Impact</button><button data-tab="incident">Incident Simulator</button></div>
<section id="project" class="panel active"><h2>New Project Analyzer</h2><label>Project name<input id="pname" value="AI Banking Platform"></label><label>Description<textarea id="pdesc">AI-powered banking analytics platform</textarea></label><label>Revenue (INR)<input id="revenue" type="number" value="500000"></label><label>Estimated hours<input id="hours" type="number" value="100"></label><label>Deadline<input id="deadline" type="datetime-local"></label><label>Priority<select id="priority"><option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option></select></label><label>Required employee count<input id="count" type="number" value="3"></label><label>Required skills (one per line: Skill,level)<textarea id="skills">Python,4
Machine Learning,4
FastAPI,3</textarea></label><button class="action" id="analyze">Analyze workforce</button><div id="projectResult" class="results"></div></section>
<section id="leave" class="panel"><h2>Leave Impact Analyzer</h2><label>Employee ID<input id="leaveEmployee" value="E014"></label><label>Start date<input id="leaveStart" type="date"></label><label>End date<input id="leaveEnd" type="date"></label><button class="action" id="leaveAnalyze">Simulate leave impact</button><div id="leaveResult" class="results"></div></section>
<section id="incident" class="panel"><h2>Incident Simulator</h2><p>Choose a digital-twin scenario. Each run is isolated from the live workforce.</p><div id="scenarioCards"></div><div id="incidentResult" class="results"></div></section></main><script src="analyzers.js"></script></body></html>
